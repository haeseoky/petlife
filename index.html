      <h1 style="font-size:1.5rem;color:#5d4037;margin-bottom:8px">🐾 PetLife — 반려동물 사주풀이</h1>
      <p>무료 반려동물 사주풀이 서비스. 강아지·고양이의 생년월일시로 성격 분석, 오늘의 운세, 궁합, MBTI, 주간 운세까지 제공합니다.</p>

      <h2 style="font-size:1.1rem;color:#795548;margin:24px 0 8px;border-bottom:2px solid #e8d5c4;padding-bottom:4px">서비스 소개</h2>
      <p>PetLife는 반려동물(강아지, 고양이)의 생년월일시를 기반으로 사주팔자를 분석하여, 우리 아이의 성격, 오늘의 운세, 궁합, MBTI 성격 유형 등을 재미있게 풀이해 드리는 무료 서비스입니다.</p>
      <p>한국 전통 사주명리학의 십이지신과 오행 이론을 바탕으로, 반려동물의 태어난 시간에 따른 고유한 성향과 특성을 분석합니다.</p>

      <h2 style="font-size:1.1rem;color:#795548;margin:24px 0 8px;border-bottom:2px solid #e8d5c4;padding-bottom:4px">주요 기능</h2>
      <ul style="padding-left:20px">
        <li><strong>🔮 사주풀이</strong> — 생년월일시로 반려동물의 사주를 분석하고, 오행 기질과 성격 특성을 상세히 풀이합니다.</li>
        <li><strong>⭐ 오늘의 운세</strong> — 매일 업데이트되는 일일 운세와 행운의 방향, 행운의 색상 등을 확인하세요.</li>
        <li><strong>💕 궁합 분석</strong> — 나의 반려동물과 다른 반려동물의 궁합을 분석해 드립니다.</li>
        <li><strong>🧠 MBTI 성격 유형</strong> — 반려동물의 사주 기반 MBTI 유형을 16가지 성격 유형으로 분류합니다.</li>
        <li><strong>📅 주간 운세</strong> — 이번 주 반려동물의 종합 운세를 일주일 단위로 확인합니다.</li>
        <li><strong>🎭 기분 트래커</strong> — 매일 반려동물의 기분을 기록하고 변화를 추적합니다.</li>
        <li><strong>🎮 밸런스 게임</strong> — 반려동물 관련 재미있는 밸런스 게임으로 우리 아이에 대해 더 알아가세요.</li>
        <li><strong>🎂 생일 카운트다운</strong> — 반려동물의 다음 생일까지 남은 일수를 확인합니다.</li>
        <li><strong>📅 행운의 캘린더</strong> — 매월 반려동물의 행운과 주의가 필요한 날을 확인합니다.</li>
        <li><strong>🏡 풍수 가이드</strong> — 반려동물에게 좋은 방위와 환경 팁을 제공합니다.</li>
      </ul>

      <h2 style="font-size:1.1rem;color:#795548;margin:24px 0 8px;border-bottom:2px solid #e8d5c4;padding-bottom:4px">이용 방법</h2>
      <ol style="padding-left:20px">
        <li>반려동물의 종류(강아지/고양이), 이름, 품종을 입력합니다.</li>
        <li>생년월일시를 입력합니다. 정확한 시간을 모르면 대략적인 시간대를 선택해도 됩니다.</li>
        <li>사주풀이 결과를 확인하고, 다양한 추가 분석을 이용해 보세요.</li>
      </ol>

      <h2 style="font-size:1.1rem;color:#795548;margin:24px 0 8px;border-bottom:2px solid #e8d5c4;padding-bottom:4px">반려동물 사주란?</h2>
      <p>사주(四柱)는 태어난 연도, 월, 일, 시간의 네 가지 기둥으로 사람(또는 동물)의 운명과 성격을 분석하는 한국 전통 명리학의 방법입니다. PetLife는 이를 반려동물에 적용하여 우리 아이의 숨겨진 성향과 특성을 알려드립니다.</p>
      <p>강아지는 12띠 중 해당하는 띠의 기질을, 고양이는 묘(卯)년의 특성을 기반으로 분석합니다. 각 동물의 오행(木·火·土·金·水) 성분에 따라 고유한 성격, 건강, 행운의 방향 등을 풀이합니다.</p>

      <h2 style="font-size:1.1rem;color:#795548;margin:24px 0 8px;border-bottom:2px solid #e8d5c4;padding-bottom:4px">자주 묻는 질문</h2>
      <p><strong>Q: 사주풀이는 정확한가요?</strong><br/>A: PetLife의 사주풀이는 전통 명리학을 기반으로 하되, 오락 목적의 서비스입니다. 반려동물과의 행복한 시간을 위한 재미로 활용해 주세요.</p>
      <p><strong>Q: 무료인가요?</strong><br/>A: 네, 모든 기능을 무료로 이용하실 수 있습니다.</p>
      <p><strong>Q: 어떤 동물이 지원되나요?</strong><br/>A: 현재 강아지와 고양이의 사주풀이를 지원합니다.</p>
